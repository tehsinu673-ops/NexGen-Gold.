<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NexGen Gold — Pakistan's #1 Investment</title>

<!-- PWA Meta Tags -->
<link rel="manifest" id="myManifest">
<meta name="theme-color" content="#FFD060">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --g1:#FFD060; --g2:#F5A800; --g3:#C67C00; --g4:#FFF3B0;
  --bg:#04040A; --bg2:#080810; --surface:#0F0F18; --surface2:#161620;
  --text:#F0F0FA; --text2:#9090B0; --text3:#505068;
  --green:#00E884; --red:#FF4D6A; --blue:#4D9EFF;
  --border:rgba(255,255,255,0.06);
}

/* Base Style */
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
body{font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); height:100dvh; overflow:hidden;}

/* Animations */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0; transform:translateY(20px)}to{opacity:1; transform:translateY(0)}}
@keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(255,208,96,0.2)}50%{box-shadow:0 0 40px rgba(255,208,96,0.5)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}

/* Loading */
#loading{position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
.loader{width:60px; height:60px; border:3px solid var(--surface2); border-top-color:var(--g1); border-radius:50%; animation:spin 1s linear infinite;}

/* App Layout */
#app{display:none; flex-direction:column; height:100dvh;}
#hdr{background:var(--bg2); padding:15px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(10px); position:sticky; top:0; z-index:100;}
.hdr-bal{font-weight:800; color:var(--g1); font-size:20px;}
#mainContent{flex:1; overflow-y:auto; padding:20px 16px 120px;}

/* Navigation */
#bnav{position:fixed; bottom:0; width:100%; background:var(--bg2); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:12px 0 25px; z-index:1000;}
.nb{background:none; border:none; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10px; cursor:pointer;}
.nb.on{color:var(--g1);}
.nb i{font-size:20px;}

/* Custom Components */
.card{background:var(--surface); border-radius:20px; padding:20px; border:1px solid var(--border); margin-bottom:15px; animation:fadeUp 0.4s ease both;}
.btn-gold{background:linear-gradient(135deg,var(--g1),var(--g2)); color:#000; border:none; padding:15px; border-radius:50px; font-weight:800; width:100%; cursor:pointer; box-shadow:0 5px 15px rgba(255,208,96,0.3);}
.btn-gold:active{transform:scale(0.96);}
.inp{width:100%; padding:14px; background:var(--surface2); border:1px solid var(--border); color:#fff; border-radius:12px; margin-bottom:10px; outline:none;}

/* Overlays */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;}
.overlay.show{display:flex;}

/* Plans */
.plan-card{border-left:4px solid var(--g1); padding:15px; background:var(--surface); margin-bottom:12px; border-radius:15px;}
.plan-expired{opacity:0.6; grayscale:1;}
</style>
</head>
<body oncontextmenu="return false;"> <!-- Right click disable -->

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
  <h2 style="color:var(--g1); font-family:'Syne'; letter-spacing:3px;">NEXGEN GOLD</h2>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen" style="display:none; padding:40px 20px; text-align:center;">
    <h1 style="font-family:'Syne'; font-size:32px; margin-bottom:10px;">NEX<span style="color:var(--g1);">GEN</span> GOLD</h1>
    <p style="color:var(--text2); margin-bottom:30px;">Pakistan's Most Secure Investment Platform</p>
    
    <div id="loginBox" class="card">
        <input type="email" id="lEmail" placeholder="Email Address" class="inp">
        <input type="password" id="lPass" placeholder="Password" class="inp">
        <button onclick="handleLogin()" class="btn-gold">LOGIN</button>
        <p style="margin-top:15px; font-size:14px;">Naya account? <span style="color:var(--g1);" onclick="toggleAuth()">Register Karein</span></p>
    </div>

    <div id="regBox" class="card" style="display:none;">
        <input type="text" id="rName" placeholder="Full Name" class="inp">
        <input type="email" id="rEmail" placeholder="Email Address" class="inp">
        <input type="password" id="rPass" placeholder="Password (Min 6)" class="inp">
        <button onclick="handleReg()" class="btn-gold">REGISTER</button>
        <p style="margin-top:15px; font-size:14px;">Account hai? <span style="color:var(--g1);" onclick="toggleAuth()">Login Karein</span></p>
    </div>
</div>

<!-- APP LAYOUT -->
<div id="app">
    <div id="hdr">
        <div>
            <p id="hName" style="font-weight:800;">User</p>
            <p style="font-size:10px; color:var(--green);">● Active Account</p>
        </div>
        <div style="text-align:right;">
            <p style="font-size:10px; color:var(--text2);">Balance</p>
            <p id="hBal" class="hdr-bal">Rs 0</p>
        </div>
    </div>

    <div id="mainContent"></div>

    <div id="bnav">
        <button class="nb on" onclick="nav('home')"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="nb" onclick="nav('work')"><i class="fas fa-gem"></i><span>Work</span></button>
        <button class="nb" onclick="nav('invest')"><i class="fas fa-wallet"></i><span>Deposit</span></button>
        <button class="nb" onclick="nav('team')"><i class="fas fa-users"></i><span>Team</span></button>
        <button class="nb" onclick="nav('me')"><i class="fas fa-user"></i><span>Me</span></button>
    </div>
</div>

<!-- SUCCESS OVERLAY -->
<div id="successOverlay" class="overlay">
    <div style="font-size:60px; margin-bottom:20px;">🎉</div>
    <h2 id="successTitle">Mubarak Ho!</h2>
    <p id="successMsg" style="color:var(--text2); margin:10px 0 30px;"></p>
    <button onclick="closeOverlay()" class="btn-gold" style="width:150px;">Theek Hai</button>
    <canvas id="confetti" style="position:absolute; inset:0; pointer-events:none;"></canvas>
</div>

<!-- PWA INSTALL BANNER -->
<div id="installPrompt" style="position:fixed; bottom:100px; left:20px; right:20px; background:var(--surface2); padding:15px; border-radius:15px; display:none; z-index:5000; border:1px solid var(--g1);">
    <div style="display:flex; align-items:center; gap:10px;">
        <i class="fas fa-download" style="color:var(--g1);"></i>
        <p style="font-size:13px;">NexGen Gold App Install Karein!</p>
        <button onclick="installApp()" style="margin-left:auto; background:var(--g1); border:none; padding:5px 15px; border-radius:5px; font-weight:800;">Install</button>
    </div>
</div>

<!-- SCRIPTS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import { getDatabase, ref, set, get, update, child } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

// === FIREBASE CONFIG (APNI KEYS LAGAYEIN) ===
const firebaseConfig = {
  apiKey: "AIzaSyD88cYTn-A78Jb4yxFD-L472hCtGq3J430",
  authDomain: "sra-821aa.firebaseapp.com",
  databaseURL: "https://sra-821aa-default-rtdb.firebaseio.com",
  projectId: "sra-821aa",
  storageBucket: "sra-821aa.firebasestorage.app",
  messagingSenderId: "417677137399",
  appId: "1:417677137399:web:384a0af2d9060e4de98af2"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

// === APP STATE ===
let U = null;
let UID = null;
const TILL_ID = "982832860";
const PLANS = [
    { id: 1, name: "Student", price: 600, daily: 15, icon: "fa-graduation-cap" },
    { id: 2, name: "Starter", price: 2000, daily: 50, icon: "fa-star" },
    { id: 3, name: "Bronze", price: 5000, daily: 125, icon: "fa-medal" },
    { id: 4, name: "Silver", price: 10000, daily: 250, icon: "fa-award" },
    { id: 5, name: "Gold", price: 25000, daily: 625, icon: "fa-crown" },
    { id: 6, name: "Platinum", price: 50000, daily: 1250, icon: "fa-gem" }
];

// === ANTI-HACK PROTECTION ===
document.onkeydown = function(e) {
    if(e.keyCode == 123) return false; // F12
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
};

// === AUTH LOGIC ===
onAuthStateChanged(auth, async (user) => {
    if (user) {
        UID = user.uid;
        const snapshot = await get(child(ref(db), `users/${UID}`));
        if (snapshot.exists()) {
            U = snapshot.val();
            showApp();
        }
    } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('authScreen').style.display = 'block';
    }
});

window.handleLogin = async () => {
    const e = document.getElementById('lEmail').value;
    const p = document.getElementById('lPass').value;
    try {
        await signInWithEmailAndPassword(auth, e, p);
        location.reload();
    } catch (err) { alert("Login Fail: " + err.message); }
};

window.handleReg = async () => {
    const n = document.getElementById('rName').value;
    const e = document.getElementById('rEmail').value;
    const p = document.getElementById('rPass').value;
    const params = new URLSearchParams(window.location.search);
    const refBy = params.get('ref');

    try {
        const res = await createUserWithEmailAndPassword(auth, e, p);
        const newUser = {
            name: n, email: e, balance: 0, totalEarn: 0, teamEarn: 0,
            joinDate: Date.now(), referredBy: refBy || null,
            activePlans: [], investments: [], withdraws: []
        };
        await set(ref(db, 'users/' + res.user.uid), newUser);
        location.reload();
    } catch (err) { alert("Registration Fail: " + err.message); }
};

// === NAVIGATION & RENDERING ===
window.nav = (tab) => {
    const content = document.getElementById('mainContent');
    const navs = document.querySelectorAll('.nb');
    navs.forEach(n => n.classList.remove('on'));
    event.currentTarget.classList.add('on');

    if (tab === 'home') renderHome(content);
    else if (tab === 'work') renderWork(content);
    else if (tab === 'invest') renderInvest(content);
    else if (tab === 'team') renderTeam(content);
    else if (tab === 'me') renderMe(content);
};

function renderHome(c) {
    let plansHtml = PLANS.map(p => {
        return `
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fas ${p.icon}" style="color:var(--g1); font-size:24px;"></i>
                    <h3 style="font-family:'Syne';">${p.name}</h3>
                </div>
                <p style="font-weight:800; color:var(--g1);">Rs ${p.price}</p>
            </div>
            <div style="display:flex; justify-content:space-around; margin:15px 0; font-size:12px;">
                <div style="text-align:center;"><p>Daily</p><b>Rs ${p.daily}</b></div>
                <div style="text-align:center;"><p>Validity</p><b>60 Days</b></div>
                <div style="text-align:center;"><p>Total</p><b>Rs ${p.daily * 60}</b></div>
            </div>
            <button onclick="buyPlan(${p.id})" class="btn-gold">INVEST NOW</button>
        </div>`;
    }).join('');
    
    c.innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#1A1A2E,#0F0F1B); border:1px solid var(--g1);">
        <p style="font-size:12px; color:var(--text2);">Total Earning</p>
        <h1 style="font-size:36px; color:var(--green);">Rs ${U.totalEarn || 0}</h1>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button onclick="nav('invest')" style="flex:1; background:var(--g1); border:none; padding:10px; border-radius:10px; font-weight:800;">Deposit</button>
            <button onclick="nav('me')" style="flex:1; background:var(--surface2); color:#fff; border:1px solid var(--border); padding:10px; border-radius:10px;">Withdraw</button>
        </div>
    </div>
    <p style="margin:20px 0 10px; font-weight:800; letter-spacing:1px; color:var(--text2);">INVESTMENT PLANS</p>
    ${plansHtml}`;
}

function renderWork(c) {
    if (!U.activePlans || U.activePlans.length === 0) {
        c.innerHTML = `<div class="card" style="text-align:center; padding:50px 20px;"><i class="fas fa-lock" style="font-size:40px; color:var(--text3); margin-bottom:15px;"></i><p>Koi plan active nahi hai. Pehle invest karein.</p></div>`;
        return;
    }

    const today = new Date().toLocaleDateString();
    let tasksHtml = U.activePlans.map((plan, index) => {
        const pInfo = PLANS.find(px => px.id === plan.id);
        const purchaseDate = new Date(plan.date);
        const diffDays = Math.floor((Date.now() - purchaseDate) / (1000 * 60 * 60 * 24));
        const isExpired = diffDays >= 60;

        return `
        <div class="card ${isExpired ? 'plan-expired' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p><b>${pInfo.name} Plan</b></p>
                <p style="color:var(--green); font-weight:800;">+Rs ${pInfo.daily}</p>
            </div>
            <p style="font-size:11px; color:var(--text2); margin-top:5px;">Day ${diffDays}/60</p>
            ${isExpired ? 
                `<button disabled class="inp" style="background:#333; border:none; margin-top:10px;">EXPIRED</button>` : 
                `<button onclick="claimProfit(${index})" class="btn-gold" style="margin-top:10px;" ${plan.lastClaim === today ? 'disabled' : ''}>
                    ${plan.lastClaim === today ? 'CLAIMED TODAY' : 'CLAIM PROFIT'}
                </button>`
            }
        </div>`;
    }).join('');

    c.innerHTML = `<h3 style="margin-bottom:15px;">Daily Mining</h3>${tasksHtml}`;
}

function renderInvest(c) {
    c.innerHTML = `
    <div class="card">
        <h3 style="text-align:center; color:var(--g1); margin-bottom:20px;">Deposit Money</h3>
        <div style="background:var(--bg2); padding:15px; border-radius:15px; text-align:center; margin-bottom:20px;">
            <p style="font-size:12px; color:var(--text2);">Merchant Till ID</p>
            <h2 style="letter-spacing:2px; margin:5px 0;">${TILL_ID}</h2>
            <button onclick="copyTill()" class="nb" style="width:auto; margin:0 auto; color:var(--g1);"><i class="fas fa-copy"></i> Copy ID</button>
        </div>
        
        <div class="card" style="background:rgba(0,232,132,0.05); border-color:rgba(0,232,132,0.2);">
            <p style="font-size:12px; font-weight:800; color:var(--green); margin-bottom:10px;">KAISE PAY KAREIN?</p>
            <p style="font-size:11px; line-height:1.6;">
                1. EasyPaisa App kholien.<br>
                2. "Payments" یا "Till Payment" par jayein.<br>
                3. Oper di gayi <b>Till ID</b> enter karein.<br>
                4. Amount send kar ke <b>Transaction ID (TRX)</b> yahan likhein.
            </p>
        </div>

        <input type="number" id="depAmt" placeholder="Amount (Min 600)" class="inp">
        <input type="text" id="depTrx" placeholder="Transaction ID (3748...)" class="inp">
        <button onclick="submitDeposit()" class="btn-gold">SUBMIT REQUEST</button>
    </div>`;
}

function renderTeam(c) {
    const refLink = `${window.location.origin}${window.location.pathname}?ref=${UID}`;
    c.innerHTML = `
    <div class="card" style="text-align:center;">
        <i class="fas fa-users" style="font-size:40px; color:var(--g1); margin-bottom:15px;"></i>
        <p style="font-size:12px; color:var(--text2);">Team Bonus</p>
        <h2 style="color:var(--g1);">Rs ${U.teamEarn || 0}</h2>
    </div>
    <div class="card">
        <p style="font-size:11px; color:var(--text2); margin-bottom:10px;">Apna link share karein aur 3 levels tak commission payein.</p>
        <div class="inp" style="font-size:10px; overflow:hidden; white-space:nowrap;">${refLink}</div>
        <button onclick="copyRef('${refLink}')" class="btn-gold">COPY LINK</button>
    </div>
    <div style="display:flex; gap:5px; margin-top:20px;">
        <div class="card" style="flex:1; text-align:center;"><p style="font-size:10px;">L1 (8%)</p><b>${U.teamCount || 0}</b></div>
        <div class="card" style="flex:1; text-align:center;"><p style="font-size:10px;">L2 (3%)</p><b>0</b></div>
        <div class="card" style="flex:1; text-align:center;"><p style="font-size:10px;">L3 (1%)</p><b>0</b></div>
    </div>`;
}

function renderMe(c) {
    c.innerHTML = `
    <div class="card" style="display:flex; align-items:center; gap:15px;">
        <div style="width:60px; height:60px; background:var(--g1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-size:24px;">
            <i class="fas fa-user"></i>
        </div>
        <div>
            <h3>${U.name}</h3>
            <p style="font-size:12px; color:var(--text2);">${U.email}</p>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom:15px;">Withdrawal</h3>
        <p style="font-size:11px; color:var(--text3); margin-bottom:10px;">* 10% Maintenance fee har withdrawal par hogi.</p>
        <input type="number" id="witAmt" placeholder="Amount (Min 500)" class="inp">
        <input type="text" id="witNum" placeholder="Account Number" class="inp">
        <select id="witMethod" class="inp">
            <option value="EasyPaisa">EasyPaisa</option>
            <option value="JazzCash">JazzCash</option>
        </select>
        <button onclick="submitWithdraw()" class="btn-gold" style="background:var(--red); color:#fff; box-shadow:none;">WITHDRAW NOW</button>
    </div>

    <button onclick="handleLogout()" class="card" style="width:100%; color:var(--red); text-align:center; font-weight:800; border:none;">LOGOUT ACCOUNT</button>
    `;
}

// === BUSINESS LOGIC ===
window.buyPlan = async (pid) => {
    const plan = PLANS.find(p => p.id === pid);
    if (U.balance < plan.price) {
        alert("Paisa kam hai! Pehle deposit karein.");
        nav('invest');
        return;
    }

    if (confirm(`Kya aap ${plan.name} plan Rs ${plan.price} mein lena chahte hain?`)) {
        U.balance -= plan.price;
        const newPlan = { id: pid, date: Date.now(), lastClaim: "never" };
        U.activePlans = U.activePlans || [];
        U.activePlans.push(newPlan);
        
        await update(ref(db, `users/${UID}`), {
            balance: U.balance,
            activePlans: U.activePlans
        });
        
        // --- Commission System ---
        if (U.referredBy) {
            await giveCommission(U.referredBy, plan.price);
        }

        showOverlay("Mubarak Ho!", `${plan.name} plan active ho gaya!`);
        updateUI();
        nav('work');
    }
};

async function giveCommission(refUID, amount) {
    const snap = await get(child(ref(db), `users/${refUID}`));
    if (snap.exists()) {
        const refUser = snap.val();
        const comm = amount * 0.08; // Level 1 (8%)
        const newBal = (refUser.balance || 0) + comm;
        const newTeamEarn = (refUser.teamEarn || 0) + comm;
        const newTotalEarn = (refUser.totalEarn || 0) + comm;
        
        await update(ref(db, `users/${refUID}`), {
            balance: newBal,
            teamEarn: newTeamEarn,
            totalEarn: newTotalEarn
        });
    }
}

window.claimProfit = async (index) => {
    const plan = U.activePlans[index];
    const pInfo = PLANS.find(p => p.id === plan.id);
    const today = new Date().toLocaleDateString();

    if (plan.lastClaim === today) return;

    U.balance += pInfo.daily;
    U.totalEarn += pInfo.daily;
    U.activePlans[index].lastClaim = today;

    await update(ref(db, `users/${UID}`), {
        balance: U.balance,
        totalEarn: U.totalEarn,
        activePlans: U.activePlans
    });

    showOverlay("Claim Success!", `Rs ${pInfo.daily} aapke wallet mein add ho gaye.`);
    updateUI();
    nav('work');
};

window.submitDeposit = async () => {
    const amt = document.getElementById('depAmt').value;
    const trx = document.getElementById('depTrx').value;
    if (!amt || !trx) return;

    const request = {
        amount: Number(amt),
        trx: trx,
        status: "Pending",
        date: new Date().toLocaleString(),
        method: "EasyPaisa"
    };

    U.investments = U.investments || [];
    U.investments.push(request);
    await update(ref(db, `users/${UID}`), { investments: U.investments });
    alert("Request bhej di gayi hai. Admin 24 hours mein approve karega.");
    nav('home');
};

window.submitWithdraw = async () => {
    const amt = Number(document.getElementById('witAmt').value);
    const num = document.getElementById('witNum').value;
    if (!amt || !num || amt < 500) {
        alert("Minimum withdraw 500 hai.");
        return;
    }

    if (amt > U.balance) {
        alert("Balance kam hai!");
        return;
    }

    const fee = amt * 0.10; // 10% Fee
    const finalAmt = amt - fee;

    if (confirm(`Rs ${amt} nikalne par Rs ${fee} fee kategi. Aapko Rs ${finalAmt} milenge. Sahi hai?`)) {
        U.balance -= amt;
        const request = {
            amount: amt,
            receive: finalAmt,
            number: num,
            status: "Pending",
            date: new Date().toLocaleString()
        };
        U.withdraws = U.withdraws || [];
        U.withdraws.push(request);
        await update(ref(db, `users/${UID}`), { balance: U.balance, withdraws: U.withdraws });
        alert("Withdrawal request lag gayi!");
        updateUI();
        nav('me');
    }
};

// === UTILS ===
function showApp() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    updateUI();
    nav('home');
}

function updateUI() {
    document.getElementById('hName').innerText = U.name;
    document.getElementById('hBal').innerText = "Rs " + U.balance.toFixed(2);
}

window.toggleAuth = () => {
    const l = document.getElementById('loginBox');
    const r = document.getElementById('regBox');
    l.style.display = l.style.display === 'none' ? 'block' : 'none';
    r.style.display = r.style.display === 'none' ? 'block' : 'none';
};

window.copyTill = () => {
    navigator.clipboard.writeText(TILL_ID);
    alert("ID Copy ho gayi!");
};

window.copyRef = (txt) => {
    navigator.clipboard.writeText(txt);
    alert("Referral Link copy ho gaya!");
};

window.showOverlay = (title, msg) => {
    document.getElementById('successTitle').innerText = title;
    document.getElementById('successMsg').innerText = msg;
    document.getElementById('successOverlay').classList.add('show');
    // Simple confetti effect
    const canvas = document.getElementById('confetti');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
};

window.closeOverlay = () => {
    document.getElementById('successOverlay').classList.remove('show');
};

window.handleLogout = () => {
    signOut(auth).then(() => location.reload());
};

</script>
