<style>
:root{
  --g1:#FFD060;--g2:#F5A800;--g3:#C67C00;--g4:#FFF3B0;
  --gold-glow:rgba(255,208,96,0.22);--gold-dim:rgba(255,208,96,0.1);--gold-bright:rgba(255,208,96,0.35);
  --bg:#04040A;--bg2:#080810;--surface:#0F0F18;--surface2:#161620;--surface3:#1C1C28;--surface4:#222230;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--border3:rgba(255,208,96,0.2);
  --text:#F0F0FA;--text2:#9090B0;--text3:#505068;
  --green:#00E884;--green-dim:rgba(0,232,132,0.1);--green-glow:rgba(0,232,132,0.25);
  --blue:#4D9EFF;--blue-dim:rgba(77,158,255,0.1);
  --red:#FF4D6A;--red-dim:rgba(255,77,106,0.1);
  --purple:#B39DFF;--cyan:#00D4FF;
  --r:20px;--r-sm:14px;--r-xs:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;}
input,select,button,textarea{font-family:'Plus Jakarta Sans',sans-serif;user-select:auto;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}
::-webkit-scrollbar{width:2px;}::-webkit-scrollbar-thumb{background:var(--surface4);border-radius:2px;}

/* KEYFRAMES */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes coinBounce{0%{transform:translateY(0)}50%{transform:translateY(-15px)}100%{transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes goldGlow{0%,100%{box-shadow:0 0 20px rgba(255,208,96,0.2)}50%{box-shadow:0 0 40px rgba(255,208,96,0.4)}}

.pulse{animation:pulse 2s ease infinite;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:9990;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.loader-ring{width:72px;height:72px;border-radius:50%;border:2px solid transparent;border-top-color:var(--g1);animation:spin 1s linear infinite;}

/* TOAST */
#toast{visibility:hidden;position:fixed;z-index:9999;left:50%;bottom:110px;transform:translateX(-50%);background:var(--surface3);color:var(--text);border:1px solid var(--border2);padding:14px 26px;border-radius:50px;font-size:13px;font-weight:700;backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,0.5);}
#toast.show{visibility:visible;animation:fadeUp .3s both;}

/* CUSTOM CONFIRM MODAL */
#confirmModal{position:fixed;inset:0;z-index:9500;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);}
.cm-sheet{width:100%;max-width:520px;background:#14121E;border-radius:32px 32px 0 0;padding:24px;animation:sheetUp 0.4s ease both;}
.cm-icon-outer{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;margin:0 auto 15px;}
.cm-invest{font-size:32px;font-weight:800;text-align:center;color:var(--g1);margin-bottom:20px;}
.cm-btns{display:flex;gap:12px;}
.cm-yes{flex:1;padding:15px;background:var(--g1);color:#000;border:none;border-radius:50px;font-weight:800;cursor:pointer;}
.cm-no{flex:1;padding:15px;background:var(--surface2);color:#fff;border:1px solid var(--border2);border-radius:50px;font-weight:700;cursor:pointer;}

/* SUCCESS OVERLAYS */
#planBuyOverlay, #successOverlay{position:fixed;inset:0;background:rgba(4,4,10,0.98);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(20px);padding:24px;}
.success-coin{width:100px;height:100px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;margin-bottom:20px;animation:coinBounce 1s infinite;}

/* AUTH */
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;display:none;padding:50px 24px;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:30px 24px;max-width:400px;margin:0 auto;}
.inp-wrap{margin-bottom:15px;}
.inp{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:14px;outline:none;}
.btn-gold{width:100%;padding:16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#000;border:none;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px var(--gold-dim);}
.link-gold{color:var(--g1);font-weight:700;cursor:pointer;}

/* APP */
#app{display:none;flex-direction:column;height:100dvh;position:relative;z-index:1;}
#hdr{background:rgba(8,8,16,0.9);padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);}
#mainContent{flex:1;overflow-y:auto;padding:16px 16px 110px;}
#bnav{position:fixed;bottom:0;width:100%;background:#080810;border-top:1px solid var(--border);display:flex;padding:10px 0 25px;justify-content:space-around;backdrop-filter:blur(20px);}
.nb{background:none;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.nb.on{color:var(--g1);}
.fab{width:60px;height:60px;border-radius:50%;background:var(--g1);margin-top:-30px;border:5px solid var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px var(--gold-dim);}

/* COMPONENT STYLES */
.hero{background:linear-gradient(145deg,#1A1500,#0A0A14);border:1px solid rgba(255,208,96,0.15);border-radius:24px;padding:26px;margin-bottom:20px;text-align:center;}
.hero-amt{font-size:38px;font-weight:900;color:var(--g1);margin:10px 0;}
.plan-card, .task-card, .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px;}
.active-plan{border-color:var(--g1);}
.sec-label{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin:20px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border2);}
.pay-display{background:var(--bg2);padding:20px;border-radius:15px;text-align:center;border:1px solid var(--border2);margin-bottom:15px;}
.pay-num{font-size:24px;font-weight:800;color:#fff;margin:10px 0;}
.bdg{padding:4px 10px;border-radius:50px;font-size:10px;font-weight:800;}
.b-appr{background:var(--green-dim);color:var(--green);}
.b-pend{background:var(--gold-dim);color:var(--g1);}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.expired-tag{color:var(--red);font-weight:800;font-size:12px;background:var(--red-dim);padding:2px 8px;border-radius:5px;}
</style>
</head>
<body>

<div id="loading">
  <div class="loader-ring"></div>
  <div style="font-family:'Syne';font-weight:800;letter-spacing:4px;color:var(--g1);margin-top:20px;">NEXGEN GOLD</div>
</div>

<!-- AUTH -->
<div id="authScreen">
  <div id="loginBox" class="auth-card">

<!-- APP LAYOUT -->
<div id="app">
  <div id="hdr">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:40px;height:40px;background:var(--g1);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="color:#000;"></i></div>
      <div><div id="hName" style="font-weight:800;font-size:14px;">---</div><div style="font-size:10px;color:var(--green);">Verified Member</div></div>
    </div>
    <div style="text-align:right;"><div style="font-size:10px;color:var(--text3);">Balance</div><div id="hBal" style="font-weight:800;color:var(--g1);font-size:18px;">Rs 0</div></div>
  </div>
  
  <div id="mainContent"></div>

  <div id="bnav">
    <button class="nb on" id="nb-home" onclick="nav('home')"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nb" id="nb-work" onclick="nav('work')"><i class="fas fa-gem"></i><span>Work</span></button>
    <button class="fab" onclick="nav('invest')"><i class="fas fa-plus" style="color:#000;font-size:24px;"></i></button>
    <button class="nb" id="nb-team" onclick="nav('team')"><i class="fas fa-users"></i><span>Team</span></button>
    <button class="nb" id="nb-me" onclick="nav('me')"><i class="fas fa-user-circle"></i><span>Me</span></button>
  </div>
</div>

<!-- MODALS -->
<div id="confirmModal">
  <div class="cm-sheet">
    <div class="cm-icon-outer"><i class="fas fa-crown" style="font-size:30px;color:#000;"></i></div>
    <h3 style="text-align:center;margin-bottom:10px;">Confirm Investment</h3>
    <div id="cmPlanName" style="text-align:center;font-weight:800;font-size:20px;">---</div>
    <div id="cmInvest" class="cm-invest">Rs 0</div>
    <p style="text-align:center;color:var(--text2);font-size:13px;margin-bottom:20px;">Daily Profit: <span id="cmDaily" style="color:var(--green);font-weight:800;">---</span><br>Validity: 60 Days (2 Months)</p>
    <div class="cm-btns">
      <button class="cm-no" onclick="confirmNo()">Nahi</button>
      <button class="cm-yes" onclick="confirmYes()">HAAN! INVEST KAREIN</button>
    </div>
  </div>
</div>

<div id="successOverlay">
  <div class="success-coin"><i class="fas fa-check" style="font-size:40px;color:#000;"></i></div>
  <h2 id="sucTitle">Success!</h2>
  <div id="sucAmt" style="font-size:45px;font-weight:900;color:var(--g1);margin:15px 0;">Rs 0</div>
  <button onclick="closeSuccess()" class="btn-gold" style="width:200px;">ZABARDAST!</button>
</div>

<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import{getDatabase,ref,set,get,child,update}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

// FIREBASE CONFIG
const FB=initializeApp({apiKey:"AIzaSyD88cYTn-A78Jb4yxFD-L472hCtGq3J430",authDomain:"sra-821aa.firebaseapp.com",databaseURL:"https://sra-821aa-default-rtdb.firebaseio.com",projectId:"sra-821aa",storageBucket:"sra-821aa.firebasestorage.app",messagingSenderId:"417677137399",appId:"1:417677137399:web:384a0af2d9060e4de98af2"});
const auth=getAuth(FB);const db=getDatabase(FB);
setPersistence(auth,browserLocalPersistence).catch(()=>{});

const PLANS=[
  {id:1,name:"Student Offer",price:600,icon:"fa-graduation-cap"},
  {id:2,name:"Starter Gold",price:2000,icon:"fa-star"},
  {id:3,name:"Bronze VIP",price:5000,icon:"fa-medal"},
  {id:4,name:"Silver VIP",price:10000,icon:"fa-award"},
  {id:5,name:"Gold VIP",price:25000,icon:"fa-crown"},
  {id:6,name:"Platinum",price:50000,icon:"fa-gem"},
  {id:7,name:"Diamond",price:100000,icon:"fa-diamond"},
  {id:8,name:"King",price:200000,icon:"fa-chess-king"},
  {id:9,name:"Elite",price:350000,icon:"fa-bolt"},
  {id:10,name:"Supreme",price:500000,icon:"fa-fire"},
  {id:11,name:"Legend",price:750000,icon:"fa-trophy"},
  {id:12,name:"NexGen Legend",price:1000000,icon:"fa-infinity"}
].map(p=>({...p,daily:Math.floor(p.price*0.025)}));

const COMM={l1:0.08,l2:0.03,l3:0.01};
const WITHDRAW_FEE = 0.10;
const PLAN_EXPIRY_DAYS = 60;

let U=null,UID=null,pendingPlanId=null;
const g=id=>document.getElementById(id);
const fmt=n=>(+n||0).toLocaleString('en-PK');
const todayKey=()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};

// AUTH FLOW
onAuthStateChanged(auth, async u=>{
  if(u){
    UID=u.uid;
    await loadData();
    g('loading').style.display='none';
    g('authScreen').style.display='none';
    g('app').style.display='flex';
    nav('home');
  } else {
    g('loading').style.display='none';
    g('app').style.display='none';
    g('authScreen').style.display='block';
    showLogin();
  }
});

async function loadData(){
  const s=await get(child(ref(db),`users/${UID}`));
  if(s.exists()){
    U=s.val();
    U.activePlans=U.activePlans||[];U.investments=U.investments||[];U.withdraws=U.withdraws||[];
  } else {
    U={name:auth.currentUser.email.split('@')[0],email:auth.currentUser.email,balance:0,totalEarn:0,teamEarn:0,teamCount:0,joinDate:Date.now(),activePlans:[],investments:[],withdraws:[]};
    await saveUser();
  }
  updateHeader();
}

async function saveUser(){await set(ref(db,'users/'+UID),U);updateHeader();}
function updateHeader(){g('hName').innerText=U.name;g('hBal').innerText='Rs '+fmt(U.balance);}

// NAV SYSTEM
function nav(tab){
  const mc=g('mainContent'); mc.innerHTML='';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  if(g('nb-'+tab)) g('nb-'+tab).classList.add('on');

  if(tab==='home')renderHome(mc);
  else if(tab==='work')renderWork(mc);
  else if(tab==='invest')renderInvest(mc);
  else if(tab==='team')renderTeam(mc);
  else if(tab==='me')renderMe(mc);
}

function renderHome(mc){
  const rows=PLANS.map(p=>{
    const myP = U.activePlans.find(x=>x.id===p.id);
    const isExpired = myP && (Date.now() - myP.date > PLAN_EXPIRY_DAYS*86400000);
    return `<div class="plan-card ${myP && !isExpired?'active-plan':''}">
      <div style="display:flex;justify-content:space-between;">
        <div style="display:flex;gap:12px;">
          <div class="plan-icon-wrap" style="width:45px;height:45px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas ${p.icon}" style="color:var(--g1);"></i></div>
          <div><b>${p.name}</b><br><span style="font-size:11px;color:var(--text3);">2.5% Daily • 60 Days</span></div>
        </div>
        <div style="text-align:right;">${myP && !isExpired?'<span class="bdg b-appr">Active</span>':isExpired?'<span class="expired-tag">Expired</span>':''}<br><b>Rs ${fmt(p.price)}</b></div>
      </div>
      <div class="info-row" style="border:none;margin-top:10px;"><span>Daily: Rs ${fmt(p.daily)}</span><span>Total: Rs ${fmt(p.daily*60)}</span></div>
      <button onclick="buyPlan(${p.id})" class="btn-gold" style="margin-top:10px;height:45px;font-size:14px;">${myP && !isExpired?'Active':'Invest Now'}</button>
    </div>`;
  }).join('');
  mc.innerHTML=`<div class="hero"><div style="font-size:12px;color:var(--text2);">Total Balance</div><div class="hero-amt">Rs ${fmt(U.balance)}</div><div style="display:flex;gap:10px;justify-content:center;"><button onclick="nav('invest')" class="btn-gold" style="width:120px;padding:10px;">Deposit</button><button onclick="nav('me')" class="btn-gold" style="width:120px;padding:10px;background:var(--surface3);color:#fff;border:1px solid var(--border);">Withdraw</button></div></div>${rows}`;
}

function renderWork(mc){
  const tk=todayKey();
  const tasks=U.activePlans.map((p,i)=>{
    const pd=PLANS.find(x=>x.id===p.id);
    const isExpired = (Date.now() - p.date > PLAN_EXPIRY_DAYS*86400000);
    const done = p.lastClaim===tk;
    return `<div class="task-card ${done?'done':''}">
      <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
        <b>${pd.name}</b> ${isExpired?'<span class="expired-tag">Expired</span>':''}
        <b style="color:var(--green);">+Rs ${fmt(pd.daily)}</b>
      </div>
      <button onclick="claimProfit(${i})" class="btn-gold" ${done||isExpired?'disabled':''} style="${done||isExpired?'background:var(--surface4);color:var(--text3);':''}">${isExpired?'Plan Expired':done?'Claimed':'Claim Profit'}</button>
    </div>`;
  }).join('');
  mc.innerHTML=`<p class="sec-label">Daily Mining</p>${tasks||'<p style="text-align:center;padding:50px;color:var(--text3);">No Active Plans</p>'}`;
}

function renderInvest(mc){
  mc.innerHTML=`<div class="card" style="padding:25px;"><h3 style="text-align:center;margin-bottom:20px;">Deposit Money</h3>
    <div class="pay-display">
      <p style="font-size:10px;color:var(--text3);margin-bottom:5px;">OFFICIAL MERCHANT TILL ID</p>
      <div class="pay-num">982832860</div>
      <button class="btn-gold" onclick="copyTill()" style="width:150px;padding:8px;font-size:12px;">Copy ID</button>
    </div>
    <p style="font-size:12px;text-align:center;color:var(--text2);margin-bottom:20px;">Apni EasyPaisa/JazzCash app kholain, "Till Pay" par jayein aur upar wali ID par payment karain.</p>
    <div class="inp-wrap"><input type="number" id="invAmt" placeholder="Amount (Min 600)" class="inp"></div>
    <div class="inp-wrap"><input type="text" id="invTrx" placeholder="Transaction ID (TRX)" class="inp"></div>
    <button onclick="submitInvest()" class="btn-gold">Submit Deposit</button>
  </div>`;
}

function renderTeam(mc){
  const link=`${window.location.origin}/?ref=${UID}`;
  mc.innerHTML=`<div class="hero"><div style="font-size:12px;">Team Earnings</div><div class="hero-amt" style="color:var(--g1);">Rs ${fmt(U.teamEarn)}</div></div>
    <div class="card" style="padding:20px;"><p style="font-size:11px;color:var(--text3);">Referral Link</p>
    <div style="background:var(--bg2);padding:10px;border-radius:10px;font-size:11px;word-break:break-all;margin:10px 0;">${link}</div>
    <button class="btn-gold" onclick="copyText('${link}')" style="padding:10px;">Copy Link</button></div>
    <div class="card" style="padding:0 15px;"><div class="info-row"><span>Level 1</span><b>8%</b></div><div class="info-row"><span>Level 2</span><b>3%</b></div><div class="info-row" style="border:none;"><span>Level 3</span><b>1%</b></div></div>`;
}

function renderMe(mc){
  mc.innerHTML=`<div class="card" style="display:flex;gap:15px;align-items:center;"><div style="width:60px;height:60px;background:var(--g1);border-radius:50%;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user-astronaut" style="font-size:25px;color:#000;"></i></div><div><b>${U.name}</b><br><span style="font-size:11px;color:var(--text3);">${U.email}</span></div></div>
    <div class="stat-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;">
      <div class="card" style="margin:0;padding:15px;"><div style="font-size:10px;">Total Earn</div><b style="color:var(--green);">Rs ${fmt(U.totalEarn)}</b></div>
      <div class="card" style="margin:0;padding:15px;"><div style="font-size:10px;">Team Count</div><b>${U.teamCount}</b></div>
    </div>
    <div class="card" style="padding:20px;"><h3>Withdraw</h3><p style="font-size:12px;color:var(--red);margin-bottom:15px;">Note: 10% processing fee apply hogi.</p>
      <div class="inp-wrap"><input type="number" id="wAmt" placeholder="Amount (Min 500)" class="inp"></div>
      <div class="inp-wrap"><input type="text" id="wNum" placeholder="Account Number" class="inp"></div>
      <button onclick="submitWithdraw()" class="btn-gold">Withdraw Now</button>
    </div>
    <button onclick="doLogout()" class="btn-gold" style="background:var(--red-dim);color:var(--red);margin-top:20px;border:1px solid var(--red);">LOGOUT</button>`;
}

// LOGIC FUNCTIONS
window.showReg=()=>{g('loginBox').style.display='none';g('regBox').style.display='block';}
window.showLogin=()=>{g('loginBox').style.display='block';g('regBox').style.display='none';}

window.handleLogin=async()=>{
  const e=g('lEmail').value,p=g('lPass').value;
  try{await signInWithEmailAndPassword(auth,e,p)}catch(err){showToast("Sahi details dalain!")}
}

window.handleReg=async()=>{
  const n=g('rName').value,e=g('rEmail').value,p=g('rPass').value,refBy=g('rRef').value;
  if(p.length<6)return showToast("Password weak hai");
  try{await createUserWithEmailAndPassword(auth,e,p); location.reload();}catch(e){showToast("Error!")}
}

window.buyPlan=(id)=>{
  const p=PLANS.find(x=>x.id===id);
  if(U.balance<p.price)return showToast("Balance kam hai!");
  pendingPlanId=id;
  g('cmPlanName').innerText=p.name; g('cmInvest').innerText='Rs '+fmt(p.price);
  g('cmDaily').innerText='Rs '+fmt(p.daily);
  g('confirmModal').style.display='flex';
}
window.confirmNo=()=>g('confirmModal').style.display='none';
window.confirmYes=async()=>{
  const p=PLANS.find(x=>x.id===pendingPlanId);
  U.balance-=p.price;
  U.activePlans.push({id:p.id,date:Date.now(),lastClaim:'never'});
  await saveUser();
  await giveCommission(UID, p.price);
  g('confirmModal').style.display='none';
  showSuccess(p.name, p.price);
}

window.claimProfit=async(idx)=>{
  const p=PLANS.find(x=>x.id===U.activePlans[idx].id);
  U.balance+=p.daily; U.totalEarn+=p.daily; U.activePlans[idx].lastClaim=todayKey();
  await saveUser();
  showSuccess("Profit Claimed", p.daily);
}

window.submitInvest=async()=>{
  const a=g('invAmt').value,t=g('invTrx').value;
  if(a<600||!t)return showToast("Sahi details dalain");
  U.investments.push({amount:parseInt(a),trx:t,method:'Till ID',status:'Pending',date:new Date().toLocaleDateString()});
  await saveUser(); showToast("Request submit ho gayi!"); nav('invest');
}

window.submitWithdraw=async()=>{
  const a=g('wAmt').value,n=g('wNum').value;
  if(a<500||a>U.balance)return showToast("Balance kam ya amount ghalat hai");
  
  const fee = a * WITHDRAW_FEE;
  const receive = a - fee;
  
  U.balance-=a;
  U.withdraws.push({amount:parseInt(a),receive:receive,fee:fee,num:n,status:'Pending',date:new Date().toLocaleDateString()});
  await saveUser(); showToast(`Withdrawal Request: Rs ${a} (Fee: Rs ${fee} cut)`); nav('me');
}

async function giveCommission(userUID, amount){
  const s=await get(child(ref(db),`users/${userUID}`));
  if(!s.exists())return;
  const data=s.val(); const up=data.upline||{};
  const levels=[{id:up.l1,r:COMM.l1},{id:up.l2,r:COMM.l2},{id:up.l3,r:COMM.l3}];
  for(let l of levels){
    if(l.id){
      const ls=await get(child(ref(db),`users/${l.id}`));
      if(ls.exists()){
        const ld=ls.val(); const c=Math.floor(amount*l.r);
        await update(ref(db,`users/${l.id}`),{balance:ld.balance+c,teamEarn:ld.teamEarn+c,totalEarn:ld.totalEarn+c});
      }
    }
  }
}

window.showSuccess=(t,a)=>{g('sucTitle').innerText=t;g('sucAmt').innerText='Rs '+fmt(a);g('successOverlay').style.display='flex';}
window.closeSuccess=()=>{g('successOverlay').style.display='none';nav('home');}
window.showToast=(m)=>{const t=g('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
window.copyTill=()=>{navigator.clipboard.writeText('982832860');showToast('Till ID Copied!');}
window.doLogout=()=>{signOut(auth).then(()=>location.reload());}

// Start-up Ref Link check
const urlP=new URLSearchParams(window.location.search);
if(urlP.get('ref')) g('rRef').value=urlP.get('ref');

window.nav=nav;
window.claimProfit=claimProfit;

</script>
