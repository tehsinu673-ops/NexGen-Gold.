<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NexGen Gold — Pakistan's #1 Investment</title>
<meta name="description" content="NexGen Premium Gold — Pakistan ka #1 trusted investment platform. Roz 2.5% daily profit kamao. Abhi join karein!">
<meta name="theme-color" content="#FFD060">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --g1:#FFD060;--g2:#F5A800;--g3:#C67C00;--g4:#FFF3B0;
  --gold-glow:rgba(255,208,96,0.22);--bg:#04040A;--bg2:#080810;--surface:#0F0F18;--surface2:#161620;--surface3:#1C1C28;--surface4:#222230;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--text:#F0F0FA;--text2:#9090B0;--text3:#505068;
  --green:#00E884;--green-dim:rgba(0,232,132,0.1);--blue:#4D9EFF;--red:#FF4D6A;--red-dim:rgba(255,77,106,0.1);--purple:#B39DFF;--r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;}
input,select,button{font-family:'Plus Jakarta Sans',sans-serif;}

/* ANIMATIONS */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes coinBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(255,208,96,0.2)}50%{box-shadow:0 0 40px rgba(255,208,96,0.5)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.loader-ring{width:60px;height:60px;border-radius:50%;border:3px solid transparent;border-top-color:var(--g1);animation:spin 1s linear infinite;}

/* TOAST */
#toast{visibility:hidden;position:fixed;z-index:9999;left:50%;bottom:110px;transform:translateX(-50%);background:var(--surface3);color:var(--text);padding:14px 26px;border-radius:50px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition: 0.3s;}
#toast.show{visibility:visible;animation:fadeUp 0.3s forwards;}

/* APP STYLES */
#app{display:none;flex-direction:column;height:100dvh;}
#hdr{background:rgba(8,8,16,0.9);padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);}
#mainContent{flex:1;overflow-y:auto;padding:16px 16px 110px;}
.hero{background:linear-gradient(145deg,#1A1500,#0A0A14);border:1px solid rgba(255,208,96,0.15);border-radius:24px;padding:26px;margin-bottom:20px;text-align:center;}
.hero-amt{font-size:38px;font-weight:900;color:var(--g1);margin:10px 0;}
.plan-card, .task-card, .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px;position:relative;}
.active-plan{border-color:var(--g1);}
.btn-gold{width:100%;padding:16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#000;border:none;border-radius:14px;font-weight:800;cursor:pointer;transition:0.2s;}
.btn-gold:active{transform:scale(0.98);}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:#fff;padding:15px;border-radius:50px;font-weight:700;cursor:pointer;}
.expired-tag{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:10px;padding:2px 8px;border-radius:5px;font-weight:800;}

/* NAV */
#bnav{position:fixed;bottom:0;width:100%;background:#080810;border-top:1px solid var(--border);display:flex;padding:10px 0 25px;justify-content:space-around;backdrop-filter:blur(20px);z-index:100;}
.nb{background:none;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;}
.nb.on{color:var(--g1);}
.nb i{font-size:20px;}
.fab{width:60px;height:60px;border-radius:50%;background:var(--g1);margin-top:-35px;border:5px solid var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px var(--gold-dim);}

/* MODALS */
#confirmModal, #successOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);}
#confirmModal .cm-sheet{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:24px;animation:fadeUp 0.3s;}
.success-coin{width:100px;height:100px;background:var(--g1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;animation:coinBounce 1s infinite;}

/* AUTH SCREEN */
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:5000;padding:40px 24px;overflow-y:auto;display:none;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px 20px;max-width:400px;margin:0 auto;}
.inp{width:100%;padding:15px;background:var(--surface2);border:1px solid var(--border);color:#fff;border-radius:12px;margin-bottom:15px;outline:none;}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="loader-ring"></div>
  <div style="color:var(--g1);font-weight:800;letter-spacing:2px;">NEXGEN GOLD</div>
</div>

<!-- AUTH SCREENS -->
<div id="authScreen">
  <div id="loginBox" class="auth-card">
    <h1 style="text-align:center;font-family:'Syne';margin-bottom:10px;">NEX<span style="color:var(--g1);">GEN</span></h1>
    <h2 style="text-align:center;margin-bottom:20px;">Welcome Back!</h2>
    <input type="email" id="lEmail" placeholder="Email Address" class="inp">
    <input type="password" id="lPass" placeholder="Password" class="inp">
    <button onclick="handleLogin()" class="btn-gold">LOGIN</button>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text2);">Account nahi hai? <span onclick="showReg()" class="link-gold">Register Karein</span></p>
  </div>

  <div id="regBox" class="auth-card" style="display:none;">
    <h1 style="text-align:center;font-family:'Syne';margin-bottom:10px;">NEX<span style="color:var(--g1);">GEN</span></h1>
    <h2 style="text-align:center;margin-bottom:20px;">Create Account</h2>
    <input type="text" id="rName" placeholder="Aapka Naam" class="inp">
    <input type="email" id="rEmail" placeholder="Email Address" class="inp">
    <input type="password" id="rPass" placeholder="Password (Min 6)" class="inp">
    <input type="text" id="rRef" placeholder="Referral Code (Optional)" class="inp">
    <button onclick="handleReg()" class="btn-gold">REGISTER</button>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text2);">Pehle se account hai? <span onclick="showLogin()" class="link-gold">Login</span></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="hdr">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:40px;height:40px;background:var(--g1);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="color:#000;"></i></div>
      <div><div id="hName" style="font-weight:800;">---</div><div style="font-size:10px;color:var(--green);">Verified Member</div></div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:10px;color:var(--text3);">Wallet</div>
      <div id="hBal" style="color:var(--g1);font-weight:900;font-size:18px;">Rs 0</div>
    </div>
  </div>

  <div id="mainContent"></div>

  <div id="bnav">
    <button class="nb on" id="nb-home" onclick="nav('home')"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nb" id="nb-work" onclick="nav('work')"><i class="fas fa-gem"></i><span>Work</span></button>
    <button class="fab" onclick="nav('invest')"><i class="fas fa-plus" style="color:#000;font-size:24px;"></i></button>
    <button class="nb" id="nb-team" onclick="nav('team')"><i class="fas fa-users"></i><span>Team</span></button>
    <button class="nb" id="nb-me" onclick="nav('me')"><i class="fas fa-user-circle"></i><span>Me</span></button>
  </div>
</div>

<!-- OVERLAYS -->
<div id="confirmModal">
  <div class="cm-sheet">
    <h3 style="text-align:center;margin-bottom:15px;">Confirm Investment</h3>
    <div id="cmPlanName" style="text-align:center;font-weight:800;font-size:20px;color:var(--g1);">---</div>
    <div id="cmInvest" style="text-align:center;font-size:28px;font-weight:900;margin:10px 0;">Rs 0</div>
    <p style="text-align:center;font-size:12px;color:var(--text2);">Daily Profit: 2.5%<br>Validity: 60 Days (2 Months)</p>
    <div class="cm-btns" style="margin-top:20px;display:flex;gap:10px;">
      <button onclick="confirmNo()" class="btn-ghost" style="flex:1;">Nahi</button>
      <button onclick="confirmYes()" class="btn-gold" style="flex:1;">HAAN!</button>
    </div>
  </div>
</div>

<div id="successOverlay">
  <div class="success-coin"><i class="fas fa-check" style="font-size:40px;color:#000;"></i></div>
  <h2 id="sucTitle">Mubarak Ho!</h2>
  <div id="sucAmt" style="font-size:36px;font-weight:900;color:var(--g1);margin:15px 0;">Rs 0</div>
  <button onclick="closeSuccess()" class="btn-gold" style="width:180px;">CLOSE</button>
</div>

<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import{getDatabase,ref,set,get,child,update}from"https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

// FIREBASE CONFIG
const FB_CONFIG = {apiKey:"AIzaSyD88cYTn-A78Jb4yxFD-L472hCtGq3J430",authDomain:"sra-821aa.firebaseapp.com",databaseURL:"https://sra-821aa-default-rtdb.firebaseio.com",projectId:"sra-821aa",storageBucket:"sra-821aa.firebasestorage.app",messagingSenderId:"417677137399",appId:"1:417677137399:web:384a0af2d9060e4de98af2"};
const app=initializeApp(FB_CONFIG);
const auth=getAuth(app);
const db=getDatabase(app);

// SETTINGS
const PLANS=[
  {id:1,name:"Student Offer",price:600,icon:"fa-graduation-cap"},
  {id:2,name:"Starter Gold",price:2000,icon:"fa-star"},
  {id:3,name:"Bronze VIP",price:5000,icon:"fa-medal"},
  {id:4,name:"Silver VIP",price:10000,icon:"fa-award"},
  {id:5,name:"Gold VIP",price:25000,icon:"fa-crown"},
  {id:6,name:"Platinum",price:50000,icon:"fa-gem"},
  {id:7,name:"Diamond",price:100000,icon:"fa-diamond"},
  {id:8,name:"King",price:200000,icon:"fa-chess-king"},
  {id:9,name:"Elite",price:350000,icon:"fa-bolt"},
  {id:10,name:"Supreme",price:500000,icon:"fa-fire"},
  {id:11,name:"Legend",price:750000,icon:"fa-trophy"},
  {id:12,name:"NexGen Legend",price:1000000,icon:"fa-infinity"}
].map(p=>({...p, daily: Math.floor(p.price * 0.025)}));

const COMM = {l1: 0.08, l2: 0.03, l3: 0.01};
const EXPIRY_DAYS = 60;
const WITHDRAW_FEE = 0.10;

let U=null,UID=null,pendingPlanId=null;
const g=id=>document.getElementById(id);
const fmt=n=>(+n||0).toLocaleString('en-PK');
const todayKey=()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};

// AUTH FLOW
onAuthStateChanged(auth, async u=>{
  if(u){
    UID=u.uid;
    await loadData();
    g('loading').style.display='none';
    g('app').style.display='flex';
    nav('home');
  } else {
    g('loading').style.display='none';
    g('authScreen').style.display='block';
    showLogin();
  }
});

async function loadData(){
  const s=await get(child(ref(db),`users/${UID}`));
  if(s.exists()){
    U=s.val();
    U.activePlans=U.activePlans||[];U.investments=U.investments||[];U.withdraws=U.withdraws||[];
  } else {
    U={name:"User",balance:0,totalEarn:0,teamEarn:0,teamCount:0,activePlans:[],investments:[],withdraws:[]};
    await saveUser();
  }
  updateHeader();
}

async function saveUser(){await set(ref(db,'users/'+UID),U);updateHeader();}
function updateHeader(){g('hName').innerText=U.name;g('hBal').innerText='Rs '+fmt(U.balance);}

// PAGES
window.nav=(tab)=>{
  const mc=g('mainContent'); mc.innerHTML='';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  g('nb-'+tab).classList.add('on');

  if(tab==='home') renderHome(mc);
  if(tab==='work') renderWork(mc);
  if(tab==='invest') renderInvest(mc);
  if(tab==='team') renderTeam(mc);
  if(tab==='me') renderMe(mc);
}

function renderHome(mc){
  const h=PLANS.map(p=>{
    const myP=U.activePlans.find(x=>x.id===p.id);
    const expired=myP && (Date.now() - myP.date > EXPIRY_DAYS*86400000);
    return `<div class="plan-card ${myP && !expired?'active-plan':''}">
      ${expired?'<span class="expired-tag">EXPIRED</span>':''}
      <div style="display:flex;justify-content:space-between;">
        <div style="display:flex;gap:10px;"><i class="fas ${p.icon}" style="color:var(--g1);font-size:20px;"></i><b>${p.name}</b></div>
        <b>Rs ${fmt(p.price)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:10px;color:var(--text2);">
        <span>Daily: Rs ${fmt(p.daily)}</span><span>Duration: 60 Days</span>
      </div>
      <button onclick="buyPlan(${p.id})" class="btn-gold" style="margin-top:15px;height:45px;">${myP && !expired?'Active':'Invest Now'}</button>
    </div>`;
  }).join('');
  mc.innerHTML=`<div class="hero"><div style="font-size:12px;">Wallet Balance</div><div class="hero-amt">Rs ${fmt(U.balance)}</div></div>${h}`;
}

function renderWork(mc){
  const tk=todayKey();
  const t=U.activePlans.map((p,i)=>{
    const pd=PLANS.find(x=>x.id===p.id);
    const expired=(Date.now() - p.date > EXPIRY_DAYS*86400000);
    const done=p.lastClaim===tk;
    return `<div class="task-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:15px;"><b>${pd.name}</b> <b style="color:var(--green);">+Rs ${fmt(pd.daily)}</b></div>
      <button onclick="claimProfit(${i})" class="btn-gold" ${done||expired?'disabled':''} style="${done||expired?'background:var(--surface4);color:var(--text3);':''}">
        ${expired?'Expired':done?'Claimed':'Claim Profit'}
      </button>
    </div>`;
  }).join('');
  mc.innerHTML=`<p class="sec-label">Mining Area</p>${t||'<p style="text-align:center;padding:40px;">No Active Plans</p>'}`;
}

function renderInvest(mc){
  mc.innerHTML=`<div class="card" style="padding:25px;text-align:center;">
    <h3>Deposit via Till ID</h3>
    <div class="pay-display">
      <div style="font-size:10px;color:var(--text3);">NexGen Merchant ID</div>
      <div class="pay-num">982832860</div>
      <button onclick="copyTill()" class="btn-gold" style="width:120px;padding:8px;font-size:12px;">Copy ID</button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:20px;">Open EasyPaisa/JazzCash -> Payments -> Till Pay -> Enter 982832860</p>
    <input type="number" id="invAmt" placeholder="Amount (Min 600)" class="inp">
    <input type="text" id="invTrx" placeholder="TRX ID" class="inp">
    <button onclick="submitInvest()" class="btn-gold">Submit Request</button>
  </div>`;
}

function renderTeam(mc){
  const link=`${window.location.origin}/?ref=${UID}`;
  mc.innerHTML=`<div class="hero"><div style="font-size:12px;">Team Revenue</div><div class="hero-amt">Rs ${fmt(U.teamEarn)}</div></div>
    <div class="card">
      <p style="font-size:12px;">Your Link:</p>
      <div style="background:var(--bg2);padding:10px;border-radius:10px;word-break:break-all;font-size:11px;margin:10px 0;">${link}</div>
      <button onclick="copyText('${link}')" class="btn-gold" style="padding:10px;">Copy Link</button>
    </div>
    <div class="card" style="padding:5px 15px;"><div class="info-row"><span>Level 1</span><b>8%</b></div><div class="info-row"><span>Level 2</span><b>3%</b></div><div class="info-row" style="border:none;"><span>Level 3</span><b>1%</b></div></div>`;
}

function renderMe(mc){
  mc.innerHTML=`<div class="card" style="display:flex;align-items:center;gap:15px;"><div style="width:50px;height:50px;background:var(--g1);border-radius:50%;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user-astronaut"></i></div><div><b>${U.name}</b><br><span style="font-size:12px;color:var(--text3);">${U.email}</span></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;">
      <div class="card" style="padding:15px;margin:0;">Earned<br><b style="color:var(--green);">Rs ${fmt(U.totalEarn)}</b></div>
      <div class="card" style="padding:15px;margin:0;">Team<br><b>${U.teamCount}</b></div>
    </div>
    <div class="card"><h3>Withdraw</h3><p style="font-size:11px;color:var(--red);margin-bottom:10px;">10% maintenance fee apply hogi.</p>
      <input type="number" id="wAmt" placeholder="Amount (Min 500)" class="inp">
      <input type="text" id="wNum" placeholder="Account Number" class="inp">
      <button onclick="submitWith()" class="btn-gold">Withdraw Now</button>
    </div>
    <button onclick="doLogout()" class="btn-gold" style="background:var(--red-dim);color:var(--red);margin-top:20px;">LOGOUT</button>`;
}

// ACTION LOGIC
window.handleLogin=async()=>{
  const e=g('lEmail').value,p=g('lPass').value;
  try{await signInWithEmailAndPassword(auth,e,p)}catch(e){showToast("Login Fail!")}
}
window.handleReg=async()=>{
  const e=g('rEmail').value,p=g('rPass').value,n=g('rName').value,refBy=g('rRef').value;
  if(p.length<6)return showToast("Password weak hai!");
  try{
    const c=await createUserWithEmailAndPassword(auth,e,p);
    const up={l1:refBy||null};
    await set(ref(db,'users/'+c.user.uid),{name:n,email:e,balance:0,totalEarn:0,teamEarn:0,teamCount:0,joinDate:Date.now(),upline:up,activePlans:[],investments:[],withdraws:[]});
    if(refBy){const rs=await get(child(ref(db),`users/${refBy}`));if(rs.exists())await update(ref(db,`users/${refBy}`),{teamCount:rs.val().teamCount+1})}
    location.reload();
  }catch(e){showToast("Error!")}
}

window.buyPlan=(id)=>{
  const p=PLANS.find(x=>x.id===id);
  if(U.activePlans.some(x=>x.id===id))return showToast("Active hai!");
  if(U.balance<p.price)return showToast("Balance kam hai!");
  pendingPlanId=id;
  g('cmPlanName').innerText=p.name;g('cmInvest').innerText='Rs '+fmt(p.price);g('cmDaily').innerText='Rs '+fmt(p.daily);
  g('confirmModal').style.display='flex';
}
window.confirmNo=()=>g('confirmModal').style.display='none';
window.confirmYes=async()=>{
  const p=PLANS.find(x=>x.id===pendingPlanId);
  U.balance-=p.price;
  U.activePlans.push({id:p.id,date:Date.now(),lastClaim:'never'});
  await saveUser();
  await giveCommission(UID, p.price);
  g('confirmModal').style.display='none';
  showSuccess(p.name, p.price);
}

window.claimProfit=async(idx)=>{
  const p=PLANS.find(x=>x.id===U.activePlans[idx].id);
  U.balance+=p.daily;U.totalEarn+=p.daily;U.activePlans[idx].lastClaim=todayKey();
  await saveUser();
  showSuccess("Mining Success", p.daily);
}

window.submitInvest=async()=>{
  const a=g('invAmt').value,t=g('invTrx').value;
  if(a<600||!t)return showToast("Details galat hain!");
  U.investments.push({amount:parseInt(a),trx:t,status:'Pending',date:new Date().toLocaleDateString()});
  await saveUser();showToast("Submitted! Wait 24h");nav('invest');
}

window.submitWith=async()=>{
  const a=g('wAmt').value,n=g('wNum').value;
  if(a<500||a>U.balance)return showToast("Invalid Amount!");
  const fee=a*WITHDRAW_FEE;
  U.balance-=a;
  U.withdraws.push({amount:parseInt(a),fee:fee,net:a-fee,num:n,status:'Pending',date:new Date().toLocaleDateString()});
  await saveUser();showToast(`Request sent! Fees: Rs ${fee}`);nav('me');
}

async function giveCommission(userUID, amount){
  const s=await get(child(ref(db),`users/${userUID}`));
  if(!s.exists())return;
  const up=s.val().upline||{};
  const levels=[{id:up.l1,r:COMM.l1},{id:up.l2,r:COMM.l2},{id:up.l3,r:COMM.l3}];
  for(let l of levels){
    if(l.id){
      const ls=await get(child(ref(db),`users/${l.id}`));
      if(ls.exists()){
        const ld=ls.val();const comm=Math.floor(amount*l.r);
        await update(ref(db,`users/${l.id}`),{balance:ld.balance+comm,teamEarn:ld.teamEarn+comm,totalEarn:ld.totalEarn+comm});
      }
    }
  }
}

// UTILS
window.showSuccess=(t,a)=>{g('sucTitle').innerText=t;g('sucAmt').innerText='Rs '+fmt(a);g('successOverlay').style.display='flex';}
window.closeSuccess=()=> {g('successOverlay').style.display='none';nav('home');}
window.showToast=m=>{const t=g('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
window.copyText=t=>{navigator.clipboard.writeText(t);showToast("Copied!");}
window.copyTill=()=>{navigator.clipboard.writeText("982832860");showToast("Till ID Copied!");}
window.doLogout=()=>{signOut(auth).then(()=>location.reload())}
window.showReg=showReg; window.showLogin=showLogin;
</script>
